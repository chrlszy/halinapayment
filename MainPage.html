<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>MainPage</title>
    <link rel="stylesheet" href="mainbodystyle.css" />
    <script type="text/javascript" src="script.js" defer></script>
  </head>
  <body>
    <!-- NAVIGATION BAR -->
    <header class="navbar">
      <div class="logo"><img src="HalinaSystemLogo.png" /></div>
      <nav class="nav-links">
        <a href="#">HOME</a>
        <a href="#">ABOUT</a>
        <a href="#">SERVICES</a>
        <a href="#">CONTACT</a>
        <button class="btnLogin-popup">LOG IN</button>
      </nav>
    </header>

    <!-- HOME -->
    <section class="top-image">
      <div class="top-picture">
        <div class="overlay-text">
          <h1>We believe in Minimalism. Less is More.</h1>
        </div>
      </div>
    </section>

    <section class="feature">
      <div class="features">
        <h3>OUR SERVICES</h3>
        <img src="background.jpg" alt="Services" />
      </div>
      <div class="features">
        <h3>CLIENT TESTIMONIALS</h3>
        <img src="background.png" alt="Testimonials" />
      </div>
      <div class="features">
        <h3>PORTFOLIO</h3>
        <img src="background.jpg" alt="Portfolio" />
      </div>
    </section>

    <!-- LOGIN PAGE -->
    <div class="wrapper">
      <span class="icon-close">
        <svg
          xmlns="http://www.w3.org/2000/svg"
          height="30px"
          viewBox="0 -960 960 960"
          width="24px"
          fill="#f8f7f6"
        >
          <path
            d="m256-200-56-56 224-224-224-224 56-56 224 224 224-224 56 56-224 224 224 224-56 56-224-224-224 224Z"
          />
        </svg>
      </span>

      <div class="form-box login">
        <h1>Log in</h1>
        <form id="form">
          <div>
            <label for="email-input">
              <span>@</span>
            </label>
            <input
              type="email"
              name="email"
              id="email-input"
              placeholder="Mygmail@gmail.com"
            />
          </div>
          <div>
            <label for="password-input">
              <svg
                xmlns="http://www.w3.org/2000/svg"
                height="24px"
                viewBox="0 -960 960 960"
                width="24px"
                fill="#f8f7f6"
              >
                <path
                  d="M240-80q-33 0-56.5-23.5T160-160v-400q0-33 23.5-56.5T240-640h40v-80q0-83 58.5-141.5T480-920q83 0 141.5 58.5T680-720v80h40q33 0 56.5 23.5T800-560v400q0 33-23.5 56.5T720-80H240Zm240-200q33 0 56.5-23.5T560-360q0-33-23.5-56.5T480-440q-33 0-56.5 23.5T400-360q0 33 23.5 56.5T480-280ZM360-640h240v-80q0-50-35-85t-85-35q-50 0-85 35t-35 85v80Z"
                />
              </svg>
            </label>
            <input
              type="password"
              name="password"
              id="password-input"
              placeholder="Password"
            />
          </div>
          <button type="submit">Sign up</button>
        </form>
        <div class="login-register">
          <p>
            New to Halina?
            <a href="#" class="signup-link">Join now</a>
          </p>
        </div>
      </div>

      <div class="form-box signup">
        <h1>Sign Up</h1>
        <form id="form">
          <div>
            <label for="username-input">
              <svg
                xmlns="http://www.w3.org/2000/svg"
                height="24px"
                viewBox="0 -960 960 960"
                width="24px"
                fill="#f8f7f6"
              >
                <path
                  d="M480-480q-66 0-113-47t-47-113q0-66 47-113t113-47q66 0 113 47t47 113q0 66-47 113t-113 47ZM160-160v-112q0-34 17.5-62.5T224-378q62-31 126-46.5T480-440q66 0 130 15.5T736-378q29 15 46.5 43.5T800-272v112H160Z"
                />
              </svg>
            </label>
            <input
              type="text"
              name="username"
              id="username-input"
              placeholder="Username"
            />
          </div>
          <div>
            <label for="email-input">
              <span>@</span>
            </label>
            <input
              type="email"
              name="email"
              id="email-input"
              placeholder="Mygmail@gmail.com"
            />
          </div>
          <div>
            <label for="password-input">
              <svg
                xmlns="http://www.w3.org/2000/svg"
                height="24px"
                viewBox="0 -960 960 960"
                width="24px"
                fill="#f8f7f6"
              >
                <path
                  d="M240-80q-33 0-56.5-23.5T160-160v-400q0-33 23.5-56.5T240-640h40v-80q0-83 58.5-141.5T480-920q83 0 141.5 58.5T680-720v80h40q33 0 56.5 23.5T800-560v400q0 33-23.5 56.5T720-80H240Zm240-200q33 0 56.5-23.5T560-360q0-33-23.5-56.5T480-440q-33 0-56.5 23.5T400-360q0 33 23.5 56.5T480-280ZM360-640h240v-80q0-50-35-85t-85-35q-50 0-85 35t-35 85v80Z"
                />
              </svg>
            </label>
            <input
              type="password"
              name="password"
              id="password-input"
              placeholder="Password"
            />
          </div>
          <div>
            <label for="repeat-password-input">
              <svg
                xmlns="http://www.w3.org/2000/svg"
                height="24px"
                viewBox="0 -960 960 960"
                width="24px"
                fill="#f8f7f6"
              >
                <path
                  d="M240-80q-33 0-56.5-23.5T160-160v-400q0-33 23.5-56.5T240-640h40v-80q0-83 58.5-141.5T480-920q83 0 141.5 58.5T680-720v80h40q33 0 56.5 23.5T800-560v400q0 33-23.5 56.5T720-80H240Zm240-200q33 0 56.5-23.5T560-360q0-33-23.5-56.5T480-440q-33 0-56.5 23.5T400-360q0 33 23.5 56.5T480-280ZM360-640h240v-80q0-50-35-85t-85-35q-50 0-85 35t-35 85v80Z"
                />
              </svg>
            </label>
            <input
              type="password"
              name="repeat-password"
              id="repeat-password-input"
              placeholder="Repeat Password"
            />
          </div>
          <button type="submit">Sign up</button>
        </form>
        <div class="login-register">
          <p>
            Already have an Acount?
            <a href="#" class="login-link">Login</a>
          </p>
        </div>
      </div>
    </div>

    <div class="overlay-bg"></div>
  </body>
</html>
